{% extends 'base.html' %}
{% load static %}

{% block title %}Complete Payment - Prepration Mentor{% endblock %}

{% block content %}
<div class="row justify-content-center" style="min-height: 60vh; align-items: center;">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-header bg-primary text-white text-center py-4 border-0">
                <i class="bi bi-credit-card-2-front fs-1 mb-2"></i>
                <h4 class="mb-0 fw-bold">Order Summary</h4>
            </div>
            <div class="card-body p-5">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                    <span class="text-muted">Desription</span>
                    <span class="fw-bold text-dark">{{ plan_name }} Subscription</span>
                </div>
                
                <div class="d-flex justify-content-between align-items-center mb-5">
                    <span class="text-muted">Total Amount</span>
                    <span class="display-6 fw-bold text-primary">₹ {{ amount }}</span>
                </div>

                <!-- Pay Button -->
                <button id="rzp-button1" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm mb-3">
                    Pay Now <i class="bi bi-shield-lock-fill ms-2"></i>
                </button>
                
                <div class="text-center">
                    <small class="text-muted"><i class="bi bi-lock"></i> 100% Secure Transaction</small>
                </div>
            </div>
            <div class="card-footer bg-light text-center py-3 border-0">
                <a href="{% url 'add_funds' %}" class="text-decoration-none text-muted small hover-primary">Cancel Payment</a>
            </div>
        </div>
    </div>
</div>

<!-- Hidden Form for submission -->
<form action="{% url 'payment_success' %}" method="POST" id="payment-form">
    {% csrf_token %}
    <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
    <input type="hidden" name="razorpay_order_id" id="razorpay_order_id" value="{{ order_id }}">
    <input type="hidden" name="razorpay_signature" id="razorpay_signature">
</form>

<!-- Razorpay Script -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "{{ key_id }}", 
    "amount": "{{ amount|floatformat:0 }}00", // Amount is in currency subunits. Default currency is INR. Hence, 50000 refers to 50000 paise
    "currency": "{{ currency }}",
    "name": "Prepration Mentor",
    "description": "Subscription for {{ plan_name }}",
    "image": "{% static 'img/logo.png' %}", // excessive fallback
    "order_id": "{{ order_id }}", 
    "handler": function (response){
        // Populate hidden form fields
        document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
        document.getElementById('razorpay_signature').value = response.razorpay_signature;
        
        // Submit the form
        document.getElementById('payment-form').submit();
    },
    "prefill": {
        "name": "{{ request.user.get_full_name|default:request.user.username }}",
        "email": "{{ request.user.email }}",
        "contact": "{{ request.user.profile.phone|default:'' }}"
    },
    "notes": {
        "transaction_id": "{{ transaction_id }}"
    },
    "theme": {
        "color": "#667eea"
    },
    "modal": {
        "ondismiss": function() {
            // Handle modal close
            window.location.href = "{% url 'add_funds' %}";
        }
    }
};

var rzp1 = new Razorpay(options);

rzp1.on('payment.failed', function (response){
    // Redirect to failed page or show error
    var form = document.createElement('form');
    form.method = 'POST';
    form.action = "{% url 'payment_failed' %}";
    
    var orderField = document.createElement('input');
    orderField.type = 'hidden';
    orderField.name = 'razorpay_order_id';
    orderField.value = response.error.metadata.order_id;
    form.appendChild(orderField);
    
    document.body.appendChild(form);
    form.submit();
});

document.getElementById('rzp-button1').onclick = function(e){
    rzp1.open();
    e.preventDefault();
}

// Auto open on load (optional, but good UX for flow)
// window.onload = function() {
//     rzp1.open();
// };
</script>
{% endblock %}
