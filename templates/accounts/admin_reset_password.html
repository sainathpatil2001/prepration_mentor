{% extends 'base.html' %}
{% load static %}

{% block title %}Admin Reset Password - Prepration Mentor{% endblock %}

{% block content %}
<div class="row justify-content-center min-vh-75 align-items-center">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-header bg-primary text-white text-center py-4 border-0">
                <i class="bi bi-shield-lock-fill fs-1 mb-2"></i>
                <h4 class="mb-0 fw-bold">Admin Reset</h4>
                <p class="mb-0 opacity-75 small">Reset your dashboard access password</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control rounded-pill px-4" id="username" name="username" placeholder="Username" required>
                        <label for="username" class="px-4">Username</label>
                    </div>
                    
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control rounded-pill px-4" id="new_password" name="new_password" placeholder="New Password" required>
                        <label for="new_password" class="px-4">New Password</label>
                    </div>
                    
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control rounded-pill px-4" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
                        <label for="confirm_password" class="px-4">Confirm Password</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm transition-transform hover-scale">
                        Reset Password
                    </button>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3 border-0">
                <a href="{% url 'admin_dashboard_overview' %}" class="text-decoration-none text-muted small hover-primary">
                    <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .min-vh-75 {
        min-height: 75vh;
    }
    .hover-scale {
        transition: transform 0.2s ease;
    }
    .hover-scale:hover {
        transform: scale(1.02);
    }
</style>
{% endblock %}
